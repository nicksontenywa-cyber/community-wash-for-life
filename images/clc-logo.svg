<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80">
  <defs>
    <linearGradient id="clcNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18365D"/>
      <stop offset="100%" stop-color="#0B1A2D"/>
    </linearGradient>
    <linearGradient id="clcGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Circular Badge -->
  <g transform="translate(6, 6)" filter="url(#badgeShadow)">
    <circle cx="34" cy="34" r="32" fill="url(#clcNavy)" stroke="url(#clcGold)" stroke-width="2"/>
    <circle cx="34" cy="34" r="28" fill="none" stroke="#FBBF24" stroke-width="0.75" stroke-dasharray="2 2" opacity="0.7"/>

    <!-- Listening Waves (Left and Right) -->
    <path d="M21 28 A12 12 0 0 0 21 40" fill="none" stroke="#FBBF24" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
    <path d="M17 24 A18 18 0 0 0 17 44" fill="none" stroke="#FBBF24" stroke-width="1.4" stroke-linecap="round" opacity="0.5"/>
    <path d="M47 28 A12 12 0 0 1 47 40" fill="none" stroke="#FBBF24" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
    <path d="M51 24 A18 18 0 0 1 51 44" fill="none" stroke="#FBBF24" stroke-width="1.4" stroke-linecap="round" opacity="0.5"/>

    <!-- Latin Cross in Center -->
    <path d="M31.5 17 h5 v34 h-5 z M25 24 h18 v4.5 h-18 z" fill="#FFFFFF"/>
    
    <!-- Caring Olive Leaves / Base Crown -->
    <path d="M26 49 C28 46 32 46 34 49 C36 46 40 46 42 49 C39 52 35 52 34 49 C33 52 29 52 26 49 Z" fill="url(#clcGold)"/>
  </g>

  <!-- Typography Light Version (for light backgrounds) -->
  <g transform="translate(82, 16)">
    <text x="0" y="20" font-family="'Playfair Display', Georgia, serif" font-size="20" font-weight="900" fill="#0F223D" letter-spacing="0.5">COMMUNITY LISTENERS</text>
    <text x="0" y="38" font-family="'Playfair Display', Georgia, serif" font-size="14.5" font-weight="700" fill="#D97706" letter-spacing="1.5">FOR CHRIST <tspan font-family="'DM Sans', sans-serif" font-size="10.5" font-weight="600" fill="#2563EB">· BUSIA, UGANDA</tspan></text>
    <text x="0" y="53" font-family="'DM Sans', sans-serif" font-size="9" font-weight="500" fill="#64748B" letter-spacing="0.8" font-style="italic">“Listening with Love, Sharing Christ’s Hope”</text>
  </g>
</svg>
