<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80">
  <defs>
    <linearGradient id="clcNavyDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="clcGoldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="badgeShadowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Circular Badge -->
  <g transform="translate(6, 6)" filter="url(#badgeShadowDark)">
    <circle cx="34" cy="34" r="32" fill="url(#clcNavyDark)" stroke="url(#clcGoldDark)" stroke-width="2"/>
    <circle cx="34" cy="34" r="28" fill="none" stroke="#FCD34D" stroke-width="0.75" stroke-dasharray="2 2" opacity="0.8"/>

    <!-- Listening Waves (Left and Right) -->
    <path d="M21 28 A12 12 0 0 0 21 40" fill="none" stroke="#FCD34D" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
    <path d="M17 24 A18 18 0 0 0 17 44" fill="none" stroke="#FCD34D" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M47 28 A12 12 0 0 1 47 40" fill="none" stroke="#FCD34D" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
    <path d="M51 24 A18 18 0 0 1 51 44" fill="none" stroke="#FCD34D" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

    <!-- Latin Cross in Center -->
    <path d="M31.5 17 h5 v34 h-5 z M25 24 h18 v4.5 h-18 z" fill="#FFFFFF"/>
    
    <!-- Caring Olive Leaves / Base Crown -->
    <path d="M26 49 C28 46 32 46 34 49 C36 46 40 46 42 49 C39 52 35 52 34 49 C33 52 29 52 26 49 Z" fill="url(#clcGoldDark)"/>
  </g>

  <!-- Typography Dark Version (for dark backgrounds) -->
  <g transform="translate(82, 16)">
    <text x="0" y="20" font-family="'Playfair Display', Georgia, serif" font-size="20" font-weight="900" fill="#FFFFFF" letter-spacing="0.5">COMMUNITY LISTENERS</text>
    <text x="0" y="38" font-family="'Playfair Display', Georgia, serif" font-size="14.5" font-weight="700" fill="url(#clcGoldDark)" letter-spacing="1.5">FOR CHRIST <tspan font-family="'DM Sans', sans-serif" font-size="10.5" font-weight="600" fill="#93C5FD">· BUSIA, UGANDA</tspan></text>
    <text x="0" y="53" font-family="'DM Sans', sans-serif" font-size="9" font-weight="400" fill="#CBD5E1" letter-spacing="0.8" font-style="italic">“Listening with Love, Sharing Christ’s Hope”</text>
  </g>
</svg>
