<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="btbcGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F3E5AB"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>
    <linearGradient id="btbcNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Church Emblem Badge -->
  <g transform="translate(10, 10)">
    <!-- Outer Shield / Circle -->
    <circle cx="50" cy="50" r="48" fill="url(#btbcNavy)" stroke="url(#btbcGold)" stroke-width="2.5" filter="url(#softGlow)"/>
    <circle cx="50" cy="50" r="42" fill="none" stroke="#D4AF37" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.7"/>

    <!-- Rays -->
    <path d="M50 16 L50 24 M50 76 L50 84 M20 50 L28 50 M72 50 L80 50 M29 29 L35 35 M65 65 L71 71 M29 71 L35 65 M65 35 L71 29" stroke="#E6C875" stroke-width="1.2" opacity="0.45" stroke-linecap="round"/>

    <!-- Latin Cross -->
    <path d="M46 26 h8 v48 h-8 z M34 37 h32 v7 h-32 z" fill="url(#btbcGold)"/>

    <!-- Open Bible Base -->
    <path d="M30 73 c6 -4 14 -4 20 0 c6 -4 14 -4 20 0 v8 c-6 -4 -14 -4 -20 0 c-6 -4 -14 -4 -20 0 z" fill="#FFFFFF" opacity="0.95"/>
    <path d="M50 73 v8" stroke="url(#btbcNavy)" stroke-width="1.2"/>
  </g>

  <!-- Typography -->
  <g transform="translate(122, 28)">
    <text x="0" y="24" font-family="'Playfair Display', Georgia, serif" font-size="20" font-weight="800" fill="#0F223D" letter-spacing="0.5">BUSIA TOWN</text>
    <text x="0" y="47" font-family="'Playfair Display', Georgia, serif" font-size="19" font-weight="700" fill="#AA771C" letter-spacing="1.2">BAPTIST CHURCH</text>
    <text x="0" y="66" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" fill="#475569" letter-spacing="2">BUSIA DISTRICT, UGANDA • MINISTRY PARTNER</text>
  </g>
</svg>
